<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SketchSync — Real-Time Multiplayer Drawing & Guessing Party Game</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap"
    />
    <style>
      @keyframes floatUpFade {
        0% {
          opacity: 1;
          transform: translateY(0) scale(0.85);
        }
        50% {
          opacity: 1;
          transform: translateY(-60px) scale(1.2);
        }
        100% {
          opacity: 0;
          transform: translateY(-130px) scale(1);
        }
      }
      @keyframes pulseGlow {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.45);
        }
        50% {
          box-shadow: 0 0 22px 4px rgba(56, 189, 248, 0.35);
        }
      }
      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background-color: #0b1120;
        background-image:
          radial-gradient(at 15% 15%, rgba(56, 189, 248, 0.14) 0px, transparent 45%),
          radial-gradient(at 85% 20%, rgba(168, 85, 247, 0.14) 0px, transparent 45%),
          radial-gradient(at 50% 85%, rgba(236, 72, 153, 0.10) 0px, transparent 50%),
          linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 100% 100%, 32px 32px, 32px 32px;
        background-attachment: fixed;
        color: #f8fafc;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
